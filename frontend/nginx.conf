server {
    listen 80;
    server_tokens off;

    # Cabeceras de seguridad. nginx NO hereda los add_header del server en un location que defina
    # los suyos, así que se repiten en cada location. (HSTS y CSP quedan para cuando haya HTTPS.)
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos bajo /assets/ salen de Vite con hash de contenido en el nombre
    # (ej. AgendaView-DNvw4abX.js) — un mismo nombre siempre es el mismo contenido, así
    # que se pueden cachear "para siempre" sin riesgo de servir una versión vieja.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # index.html en cambio SÍ cambia entre builds (referencia los hashes de arriba) y no
    # tiene nombre versionado — sin esto el navegador podía quedarse con un index.html
    # viejo apuntando a assets que ya no existen tras un rebuild, obligando a un hard
    # refresh manual cada vez.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # El token de restablecer contraseña viaja en la URL: que no salga en el Referer de
    # ningún enlace o recurso externo que se cargue desde esa página.
    location ^~ /restablecer-contrasena/ {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }

    # Lo mismo con el enlace único de consentimiento informado.
    location ^~ /consentimiento/ {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
