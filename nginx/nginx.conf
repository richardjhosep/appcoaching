server {
    listen 80;
    server_tokens off;

    # El default de nginx es 1 MB: cortaba con 413 cualquier CV/evaluación/PDF legal/recurso
    # sobre 1 MB antes de llegar al backend. La app acepta hasta 20 MB por archivo (multer);
    # 25 MB deja margen para el overhead del multipart.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
